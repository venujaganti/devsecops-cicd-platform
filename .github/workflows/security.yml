name: Security Scan

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  schedule:
    - cron: "30 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Verify Podman
        run: |
          podman --version

      - name: Build backend image
        run: |
          podman build \
            --file backend/Containerfile \
            --tag devsecops-backend:security \
            backend

      - name: Build frontend image
        run: |
          podman build \
            --file frontend/Containerfile \
            --tag devsecops-frontend:security \
            frontend

      - name: Export backend image
        run: |
          podman save             --output backend-security.tar             devsecops-backend:security

      - name: Export frontend image
        run: |
          podman save             --output frontend-security.tar             devsecops-frontend:security

      - name: Run Trivy backend image scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          input: /github/workspace/backend-security.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy frontend image scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          input: /github/workspace/frontend-security.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
