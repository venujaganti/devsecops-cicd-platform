version: "3.8"

services:

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: devsecops-postgres

    environment:
      POSTGRES_DB: devsecops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d devsecops
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    networks:
      - devsecops-network

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Containerfile

    container_name: devsecops-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_NAME: "DevSecOps CI/CD Platform API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"

      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/devsecops"

      SECRET_KEY: "change-this-development-secret-key-please-replace-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"

    ports:
      - "8000:8000"

    networks:
      - devsecops-network

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile

    container_name: devsecops-frontend

    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"

    networks:
      - devsecops-network

    restart: unless-stopped


networks:
  devsecops-network:
    driver: bridge


volumes:
  postgres_data:
