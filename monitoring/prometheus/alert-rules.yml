groups:
  - name: platform-alerts
    rules:

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Prometheus target is down"
          description: "The Prometheus target {{ $labels.job }} has been unavailable for more than 2 minutes."

      - alert: PrometheusConfigurationReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          component: prometheus
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus has not successfully reloaded its configuration."

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus rule evaluation failed"
          description: "Prometheus has experienced rule evaluation failures during the last 5 minutes."