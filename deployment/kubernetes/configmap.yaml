apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-config
  namespace: devsecops
  labels:
    app.kubernetes.io/name: devsecops-config
    app.kubernetes.io/part-of: devsecops-cicd-platform

data:
  APP_NAME: "DevSecOps CI/CD Platform API"
  APP_VERSION: "1.0.0"
  DEBUG: "false"

  POSTGRES_DB: "devsecops"
  POSTGRES_USER: "postgres"
  POSTGRES_SERVER: "postgres"

  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"

  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  CORS_ORIGINS: "http://localhost,http://localhost:80,http://devsecops.local"