apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-ingress
  namespace: devsecops
  labels:
    app.kubernetes.io/name: devsecops-ingress
    app.kubernetes.io/part-of: devsecops-cicd-platform

  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx

  rules:
    - host: devsecops.local

      http:
        paths:

          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific

            backend:
              service:
                name: backend
                port:
                  number: 8000

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: 80