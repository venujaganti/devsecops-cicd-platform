apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devsecops
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devsecops-cicd-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devsecops-cicd-platform

    spec:
      containers:
        - name: backend

          image: devsecops-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: APP_NAME

            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: APP_VERSION

            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DEBUG

            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: ALGORITHM

            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES

            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: CORS_ORIGINS

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devsecops-secret
                  key: SECRET_KEY

            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres:5432/devsecops"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secret
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi