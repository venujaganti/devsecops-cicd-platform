apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default-receiver
      group_by:
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default-receiver